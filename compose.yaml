# homelab-nvr: Frigate NVR (object detection on Intel iGPU via OpenVINO, VAAPI decode)
name: nvr

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      FRIGATE_CAM_USER: ${FRIGATE_CAM_USER}
      FRIGATE_CAM_PASSWORD: ${FRIGATE_CAM_PASSWORD}
      FRIGATE_CAM1_IP: ${FRIGATE_CAM1_IP}
      FRIGATE_CAM2_IP: ${FRIGATE_CAM2_IP}
      FRIGATE_CAM3_IP: ${FRIGATE_CAM3_IP}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APPDATA}/frigate:/config            # config.yml (from config/config.example.yml) + frigate.db
      - ${RECORDINGS}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
